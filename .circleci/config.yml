version: 2.1

jobs:
  docker-check:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run: echo "docker job is alive on $(date -u)"

  mac-check:
    macos:
      xcode: 27.1.0
    resource_class: m4pro.medium
    steps:
      - run:
          name: Host facts
          command: |
            uname -m
            sysctl -n hw.memsize | awk '{printf "memory: %.1f GiB\n", $1/1073741824}'
            xcodebuild -version

workflows:
  check:
    jobs:
      - docker-check
      - mac-check
