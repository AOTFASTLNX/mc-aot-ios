version: 2.1

jobs:
  sim-run:
    macos:
      xcode: 27.1.0
    resource_class: m4pro.medium
    environment:
      HOMEBREW_NO_AUTO_UPDATE: 1
      PYTHONDONTWRITEBYTECODE: "1"
      UPSTREAM: https://github.com/AOTFASTLNX/MCFAO
      SOURCE_REF: fix/ipados-mouse-trackpad-look
    steps:
      - run:
          name: Host
          command: |
            uname -m; sysctl -n hw.memsize | awk '{printf "memory: %.1f GiB\n", $1/1073741824}'
      - run:
          name: Build and run in the simulator
          no_output_timeout: 45m
          command: |
            set -euo pipefail
            mkdir -p ~/sim && cd ~/sim
            curl -fsSL -o build_sim.sh https://raw.githubusercontent.com/zhangrongxue/mc-aot-ios/main/ci/build_sim.sh
            MCFAO_TOKEN="$MCFAO_TOKEN" bash build_sim.sh
      - store_artifacts:
          path: ~/mcfao-sim/sim-165s.jpg
          destination: sim-165s.jpg
      - store_artifacts:
          path: ~/mcfao-sim/sim-45s.jpg
          destination: sim-45s.jpg
      - store_artifacts:
          path: ~/mcfao-sim/sim-click1.jpg
          destination: sim-click1.jpg
      - store_artifacts:
          path: ~/mcfao-sim/latest.log
          destination: latest.log
      - store_artifacts:
          path: ~/mcfao-sim/c0-logs
          destination: c0-logs
      - run:
          name: Tail on failure
          when: on_fail
          command: tail -60 ~/mcfao-sim/build.log || true

workflows:
  sim:
    jobs:
      - sim-run
