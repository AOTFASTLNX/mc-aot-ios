version: 2.1

jobs:
  build-aot:
    macos:
      xcode: 27.1.0
    resource_class: m4pro.medium
    environment:
      HOMEBREW_NO_AUTO_UPDATE: 1
      PYTHONDONTWRITEBYTECODE: "1"
      UPSTREAM: https://github.com/AOTFASTLNX/MCFAO
      SOURCE_REF: feature/performance-launcher-size-2026-11-13
      MCFAO_OPT_LEVEL: -O3
    steps:
      - run:
          name: Host facts
          command: |
            uname -m; sysctl -n hw.memsize | awk '{printf "memory: %.1f GiB\n", $1/1073741824}'
            xcodebuild -version | head -2
      - run:
          name: Build the game IPA
          no_output_timeout: 60m
          command: |
            set -euo pipefail
            mkdir -p ~/build && cd ~/build
            curl -fsSL -o build_mac.sh https://raw.githubusercontent.com/zhangrongxue/mc-aot-ios/main/build_mac.sh
            MCFAO_TOKEN="$MCFAO_TOKEN" HEAP_GIB=8 JOBS=6 AOT_PAR=4 SLIM_ASSETS=1 \
              UPSTREAM="$UPSTREAM" SOURCE_REF="$SOURCE_REF" bash build_mac.sh
      - store_artifacts:
          path: ~/mcfao-build/FabricAOT-game.ipa
          destination: FabricAOT-game.ipa
      - store_artifacts:
          path: ~/mcfao-build/build.log
          destination: build.log
      - run:
          name: Tail on failure
          when: on_fail
          command: tail -60 ~/mcfao-build/build.log || true

workflows:
  build:
    jobs:
      - build-aot
