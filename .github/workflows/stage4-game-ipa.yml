name: stage4-game-ipa

on:
  workflow_dispatch:
    inputs:
      heap_gib:
        description: heap for the client analysis (6 is the pinned upstream value)
        required: false
        default: "6"
      runner:
        description: runner label
        required: false
        default: macos-26
      parallelism:
        description: native-image parallelism 1..4
        required: false
        default: "4"

jobs:
  game:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 240
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare upstream tree
        env:
          MCFAO_TOKEN: ${{ secrets.MCFAO_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${MCFAO_TOKEN}@github.com/kexinOvO/MCFAO.git" src
          echo "commit: $(git -C src rev-parse --short HEAD)"
          python3 ci/patch_src.py src
          mkdir -p .ci/bin
          printf '#!/bin/sh\necho "{}"\n' > .ci/bin/aar
          chmod +x .ci/bin/aar
          echo "$PWD/.ci/bin" >> "$GITHUB_PATH"
          # Pick an Xcode that actually exists on this image; the tools spawn absolute
          # /Applications/Xcode.app paths, so that path must be a real bundle.
          XC=/Applications/Xcode_16.4.app
          if [ ! -d "$XC" ]; then
            XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "XCODE=$XC"
          ls /Applications | grep -i xcode || true
          sudo ln -sfn "$XC" /Applications/Xcode.app
          sudo xcode-select -s "$XC"
          xcode-select -p
          if ! xcrun -f metal >/dev/null 2>&1; then
            echo "metal toolchain missing; downloading"
            sudo xcodebuild -downloadComponent MetalToolchain || true
            xcrun -f metal || true
          fi

      - name: Restore toolchains
        uses: actions/cache/restore@v4
        with:
          path: |
            src/.cache/toolchains
            src/.cache/upstream
          key: mcfao-toolchains-v1
          restore-keys: mcfao-toolchains-

      - name: Restore stage2 inputs
        uses: actions/cache/restore@v4
        with:
          path: |
            src/artifacts/b1/runtime-ios
            src/artifacts/b0/prepared-04
            src/artifacts/compiler/method-splitter-01
            src/artifacts/ci/mc
            src/artifacts/graphics/game-assets-01
          key: mcfao-stage2-none
          restore-keys: mcfao-stage2-

      - name: Restore graphics libraries
        uses: actions/cache/restore@v4
        with:
          path: |
            src/artifacts/graphics/glfw-ios-world-01
            src/artifacts/graphics/lwjgl-ios-world-01
            src/artifacts/graphics/metal-ios-world-03
            src/artifacts/graphics/openal-ios-world-01
            src/artifacts/graphics/shaders-ios-world-01
          key: mcfao-stage3-none
          restore-keys: mcfao-stage3-

      - name: Graphics libraries (only if the cache did not provide them)
        run: |
          set -euo pipefail
          cd src
          G=artifacts/graphics
          if [ -d "$G/glfw-ios-world-01" ] && [ -d "$G/lwjgl-ios-world-01" ] && [ -d "$G/metal-ios-world-03" ] \
             && [ -d "$G/openal-ios-world-01" ] && [ -d "$G/shaders-ios-world-01" ]; then
            echo "graphics cache present"; exit 0
          fi
          python3 -B tools/fetch_stb.py
          python3 -B tools/build_method_splitter.py --output artifacts/ci/splitter-bootstrap --fetch-missing
          test -d "$G/glfw-ios-world-01" || python3 -B tools/build_glfw_lite.py --sdk iphoneos --output "$G/glfw-ios-world-01" --test-host
          test -d "$G/lwjgl-ios-world-01" || python3 -B tools/build_lwjgl_lite.py --sdk iphoneos \
            --glfw-library "$G/glfw-ios-world-01/libglfw.dylib" --output "$G/lwjgl-ios-world-01"
          test -d "$G/shader-toolchain-03" || python3 -B tools/prepare_shader_toolchain.py --output "$G/shader-toolchain-03"
          test -d "$G/shader-catalog-03" || python3 -B tools/collect_shader_catalog.py --output "$G/shader-catalog-03"
          test -d "$G/metal-ios-world-03" || python3 -B tools/build_metal_backend.py --sdk iphoneos \
            --graphics-bridge "$G/lwjgl-ios-world-01" \
            --glfw-library "$G/glfw-ios-world-01/libglfw.dylib" --output "$G/metal-ios-world-03"
          test -d "$G/openal-ios-world-01" || python3 -B tools/build_openal_soft.py --sdk iphoneos --output "$G/openal-ios-world-01"
          test -d "$G/shaders-ios-world-01" || python3 -B tools/translate_shaders.py --sdk iphoneos \
            --catalog "$G/shader-catalog-03" --toolchain "$G/shader-toolchain-03" --output "$G/shaders-ios-world-01"

      - name: Cache the freshly built graphics libraries
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            src/artifacts/graphics/glfw-ios-world-01
            src/artifacts/graphics/lwjgl-ios-world-01
            src/artifacts/graphics/metal-ios-world-03
            src/artifacts/graphics/openal-ios-world-01
            src/artifacts/graphics/shaders-ios-world-01
            src/artifacts/graphics/shader-toolchain-03
            src/artifacts/graphics/shader-catalog-03
          key: mcfao-stage3-${{ github.run_id }}

      - name: Verify inputs
        run: |
          set -euo pipefail
          cd src
          for d in artifacts/b0/prepared-04 artifacts/b1/runtime-ios artifacts/compiler/method-splitter-01 \
                   artifacts/ci/mc artifacts/graphics/game-assets-01 artifacts/graphics/glfw-ios-world-01 \
                   artifacts/graphics/lwjgl-ios-world-01 artifacts/graphics/metal-ios-world-03 \
                   artifacts/graphics/openal-ios-world-01 artifacts/graphics/shaders-ios-world-01; do
            test -d "$d" || { echo "missing $d"; exit 1; }
          done
          GRAAL=$(ls -d "$PWD"/.cache/toolchains/graalvm-25.0.2/*/Contents/Home)
          echo "GRAALVM_HOME=$GRAAL" >> "$GITHUB_ENV"
          python3 -c "import json;print(json.load(open('artifacts/b1/runtime-ios/result.json'))['status'])"

      - name: Split methods
        run: |
          set -euo pipefail
          cd src
          mkdir -p artifacts/ci
          python3 - <<'PY' > /tmp/cp.txt
          import json
          prepared = json.load(open("artifacts/b0/prepared-04/result.json", encoding="utf-8"))
          print(":".join(row["path"] for row in prepared["referenceLibraries"]))
          PY
          time python3 -B tools/split_methods.py \
            --jar artifacts/ci/mc/meta/versions/26.1.2/26.1.2.jar \
            --output-jar artifacts/ci/client-split.jar \
            --report artifacts/ci/split-report.json \
            --tool artifacts/compiler/method-splitter-01 \
            --classpath-file /tmp/cp.txt

      - name: Inject Metal backend
        run: |
          set -euo pipefail
          cd src
          time python3 -B tools/inject_metal_backend.py --client artifacts/ci/client-split.jar \
            --output artifacts/ci/injected --graalvm-home "$GRAALVM_HOME" \
            --asm-jars .cache/libs/asm-9.9/asm-9.9.jar .cache/libs/asm-9.9/asm-tree-9.9.jar
          ls artifacts/ci/injected

      - name: A1 probe for the CAP cache
        run: |
          set -euo pipefail
          cd src
          time python3 -B tools/run_a1_probe.py --graalvm-home "$GRAALVM_HOME" \
            --output artifacts/ci/a1 --mode ios-relocatable || true
          ls artifacts/ci/a1/caps | head -3

      - name: Client AOT (relocatable object)
        run: |
          set -euo pipefail
          cd src
          time python3 -B tools/probe_client_graph.py \
            --prepared artifacts/b0/prepared-04 \
            --runtime artifacts/b1/runtime-ios \
            --caps artifacts/ci/a1/caps \
            --b1-evidence artifacts/evidence/b1-user-device-run-01/result.json \
            --client-jar artifacts/ci/injected/client-26.1.2-metal.jar \
            --graphics-bridge artifacts/graphics/lwjgl-ios-world-01 \
            --metal-bootstrap artifacts/graphics/metal-ios-world-03 \
            --full-build --relocatable --include-game-resources \
            --heap-gib "${{ inputs.heap_gib }}" --parallelism "${{ inputs.parallelism }}" \
            --output artifacts/ci/aot
          python3 -c "import json;d=json.load(open('artifacts/ci/aot/result.json'));print(d['status'],d.get('imageObject',{}).get('bytes'))"

      - name: Device runtime + link
        run: |
          set -euo pipefail
          cd src
          OBJ=$(python3 -c "import json;print(json.load(open('artifacts/ci/aot/result.json'))['imageObject']['path'])")
          time python3 -B tools/build_ios_runtime.py --sdk iphoneos --with-extnet \
            --graalvm-home "$GRAALVM_HOME" --aot-object "$OBJ" \
            --output artifacts/graphics/runtime-ios-world-02
          time python3 -B tools/link_c0_ios.py --sdk iphoneos --image artifacts/ci/aot \
            --runtime artifacts/graphics/runtime-ios-world-02 --stub-unsupported-jni \
            --output artifacts/graphics/main-link-ios-world-01
          ls -la artifacts/graphics/main-link-ios-world-01/client-graph.dylib

      - name: Stage WorldDevice inputs
        run: |
          set -euo pipefail
          cd src
          python3 -B tools/stage_device_xcode.py \
            --client artifacts/graphics/main-link-ios-world-01 \
            --glfw artifacts/graphics/glfw-ios-world-01 \
            --lwjgl artifacts/graphics/lwjgl-ios-world-01 \
            --metal artifacts/graphics/metal-ios-world-03 \
            --openal artifacts/graphics/openal-ios-world-01 \
            --shaders artifacts/graphics/shaders-ios-world-01 \
            --output artifacts/graphics/world-device-input-02
          ls artifacts/graphics/world-device-input-02

      - name: Build unsigned WorldDevice app and wrap the IPA
        run: |
          set -euo pipefail
          cd src
          G=artifacts/graphics
          xcodebuild -project ios/C0Harness/C0Harness.xcodeproj -scheme WorldDevice \
            -configuration "World Device" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$G/world-device-01/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            FAOT_GRAPHICS_NATIVE_DIR="$PWD/$G/world-device-input-02" \
            FAOT_CLIENT_LIBRARY="$PWD/$G/world-device-input-02/client-graph.dylib" \
            FAOT_GAME_ASSETS_DIR="$PWD/$G/game-assets-01/assets" \
            build | tail -25
          APP=$(find "$G/world-device-01/DerivedData/Build/Products" -maxdepth 2 -name '*.app' | head -1)
          echo "APP=$APP"
          test -n "$APP"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && /usr/bin/zip -qry ../FabricAOT-game.ipa Payload)
          ls -la FabricAOT-game.ipa
          /usr/bin/shasum -a 256 FabricAOT-game.ipa
          du -sh dist/Payload

      - name: Upload game IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FabricAOT-game-ipa
          path: FabricAOT-game.ipa
          if-no-files-found: warn

      - name: Diagnostics
        if: failure()
        run: |
          set +e
          for f in $(find src/artifacts/graphics src/artifacts/ci -name 'stderr.log' -size +0 | head -8); do echo "-- $f"; tail -30 "$f"; done
          for f in $(find src/artifacts/graphics src/artifacts/ci -name 'result.json' | head -6); do echo "-- $f"; head -c 1500 "$f"; echo; done
          find src/artifacts -name 'stdout.log' -size +0 | head -4 | while read f; do echo "-- $f"; tail -20 "$f"; done
          df -h /

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            src/artifacts/**/result.json
            src/artifacts/**/stderr.log
            src/artifacts/**/stdout.log
          retention-days: 3
          if-no-files-found: ignore




