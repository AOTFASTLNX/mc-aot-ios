name: probe-intel-runner

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - name: Host facts
        run: |
          set -euo pipefail
          uname -m; sysctl -n hw.ncpu
          sysctl -n hw.memsize | awk '{printf "memory: %.1f GiB\n", $1/1073741824}'
          df -h / | tail -1
          xcode-select -p; xcodebuild -version | head -2

  aot:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - name: Fetch Liberica NIK 25 for macOS x64
        run: |
          set -euo pipefail
          curl -fsSL -o nik.tgz \
            "https://github.com/bell-sw/LibericaNIK/releases/download/25.0.4.1+1-25.0.4.1+2/bellsoft-liberica-vm-openjdk25.0.4.1+2-25.0.4.1+1-macos-amd64.tar.gz"
          ls -la nik.tgz
          mkdir -p nik && tar -xzf nik.tgz -C nik
          NI=$(find nik -type f -path "*/Contents/Home/bin/native-image" | head -1)
          echo "native-image: $NI"
          echo "NI_HOME=$(dirname "$(dirname "$NI")")" >> "$GITHUB_ENV"
          "$NI" --version

      - name: Can this host emit an IOS_AARCH64 relocatable object
        run: |
          set +e
          HOME_DIR="$NI_HOME"
          mkdir -p t out
          cat > t/Probe.java <<'JAVA'
          public class Probe { public static void main(String[] a) { System.out.println("x64->ios " + a.length); } }
          JAVA
          "$HOME_DIR/bin/javac" -d t t/Probe.java || exit 1
          "$HOME_DIR/bin/native-image" \
            --no-fallback -O1 --parallelism=2 \
            -J-Xmx4g \
            -H:+UnlockExperimentalVMOptions -H:-CheckToolchain \
            -H:+ExitAfterRelocatableImageWrite -H:PageSize=16384 \
            -Dsvm.targetName=iOS -Dsvm.targetArch=arm64 \
            -Dsvm.platform=org.graalvm.nativeimage.Platform\$IOS_AARCH64 \
            -cp t Probe -o out/probe 2>&1 | tail -30
          code=$?
          echo "exit=$code"
          find . -name '*.o' | head
          if [ -f out/probe.o ]; then file out/probe.o; lipo -info out/probe.o 2>/dev/null; fi
