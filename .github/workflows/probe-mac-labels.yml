name: probe-mac-labels

on:
  workflow_dispatch:

jobs:
  facts:
    strategy:
      fail-fast: false
      matrix:
        label: [macos-14, macos-15, macos-26, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.label }}
    timeout-minutes: 20
    steps:
      - name: Facts
        run: |
          set -euo pipefail
          echo "label: ${{ matrix.label }}"
          uname -m
          sysctl -n machdep.cpu.brand_string 2>/dev/null || true
          sysctl -n hw.ncpu
          sysctl -n hw.memsize | awk '{printf "memory: %.1f GiB\n", $1/1073741824}'
          sw_vers -productVersion
          xcodebuild -version | head -2
